name: Comprobar y enviar a Telegram cada 3 días

on:
  # GitHub cron no permite expresar un intervalo exacto de 72 horas entre meses.
  # El workflow se despierta una vez al día y el paso de cadencia solo deja
  # ejecutar la comprobación cuando han pasado al menos 3 días completos.
  schedule:
    - cron: '17 15 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Comprobar cadencia de 3 días
        id: cadencia
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Una ejecución manual siempre realiza la comprobación.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            echo "motivo=Ejecución manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(date +%s)

          # Primera ejecución con la nueva lógica: comprobar inmediatamente.
          if [[ ! -f last_check.txt ]]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            echo "motivo=No existe una comprobación anterior registrada" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST=$(tr -d '[:space:]' < last_check.txt)
          if ! [[ "$LAST" =~ ^[0-9]+$ ]]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            echo "motivo=Marca anterior inválida; se fuerza una comprobación segura" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ELAPSED=$((NOW - LAST))
          THREE_DAYS=$((3 * 24 * 60 * 60))

          if (( ELAPSED >= THREE_DAYS )); then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            echo "motivo=Han pasado al menos 72 horas desde la última comprobación" >> "$GITHUB_OUTPUT"
          else
            REMAINING=$((THREE_DAYS - ELAPSED))
            HOURS=$(((REMAINING + 3599) / 3600))
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
            echo "motivo=Aún no han pasado 72 horas; faltan aproximadamente ${HOURS} h" >> "$GITHUB_OUTPUT"
          fi

      - name: Mostrar omisión por cadencia
        if: steps.cadencia.outputs.ejecutar != 'true'
        run: |
          echo "### Comprobación omitida" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.cadencia.outputs.motivo }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar Python
        if: steps.cadencia.outputs.ejecutar == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        if: steps.cadencia.outputs.ejecutar == 'true'
        run: pip install -r requirements.txt

      - name: Ejecutar la comprobación
        if: steps.cadencia.outputs.ejecutar == 'true'
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado de la comprobación
        if: steps.cadencia.outputs.ejecutar == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          date +%s > last_check.txt

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add last_post.txt last_check.txt

          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualizar estado del bot"
            git push
          fi
